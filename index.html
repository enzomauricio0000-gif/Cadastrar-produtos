<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produtos</title>
    <link rel="stylesheet" href="estilo.css">
    <!-- Biblioteca para gerar QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <!-- Formulário de Cadastro -->
        <form id="form-produto">
            <input type="text" id="nome" placeholder="Nome do Produto" required>
            <input type="number" id="preco" step="0.01" placeholder="Preço (R$)" required>
            <button type="submit">Cadastrar Produto</button>
        </form>

        <!-- Tabela de Produtos Cadastrados -->
        <h2>Produtos Cadastrados</h2>
        <table>
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="lista-produtos">
                <!-- Produtos adicionados via JavaScript -->
            </tbody>
        </table>

        <!-- Área de Exibição da Etiqueta com QR Code -->
        <div id="area-etiqueta" class="etiqueta-container" style="display: none;">
            <h3>Etiqueta do Produto</h3>
            <p id="etiqueta-nome"></p>
            <p id="etiqueta-preco"></p>
            
            <!-- Div onde o QR Code será renderizado -->
            <div id="qrcode"></div>

            <!-- Botão com explicação do seu funcionamento -->
            <button id="btn-imprimir" onclick="imprimirEtiqueta()" title="Clique para abrir a caixa de diálogo de impressão e imprimir a etiqueta com o QR Code deste produto.">
                🖨️ Imprimir Etiqueta com QR Code
            </button>
            <p class="explicacao-botao">
                <em>ℹ️ Este botão gera uma versão simplificada contendo apenas as informações do produto e o QR Code para ser colada no item.</em>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
